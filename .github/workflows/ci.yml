name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev

      - name: Configure
        run: cmake -S exec_graph -B build/exec_graph -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/exec_graph

      - name: Test
        run: ctest --test-dir build/exec_graph --output-on-failure
